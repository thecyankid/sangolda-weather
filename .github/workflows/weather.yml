name: Update Sangolda Weather

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate weather RSS
        run: python generate_weather.py

      - name: Commit weather feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.xml
          git diff --cached --quiet || git commit -m "Update Sangolda weather"
          git push
